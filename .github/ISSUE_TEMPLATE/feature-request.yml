name: Feature request
description: Propose a focused addition to Vite Link
title: 'feature: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What backend build or development problem is not covered today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest public behavior that would solve the problem.
    validations:
      required: true
  - type: dropdown
    id: ownership
    attributes:
      label: Best ownership
      options:
        - Framework-neutral core
        - Existing adapter
        - New adapter
        - Unsure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or existing tools have you tried?
