name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20.19.0
          - os: ubuntu-latest
            node: 22.12.0
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run pack:check

  real-nest:
    name: Real Nest consumer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20.19.0
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run test:smoke:nest

  peer-compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: TypeScript 5.6 / Vite 8.0 minimum peers
            typescript: 5.6.3
            vite: 8.0.0
          - name: TypeScript 5.7 / current Vite 8 peers
            typescript: 5.7.3
            vite: 8.2.2
          - name: TypeScript 5.8 / current Vite 8 peers
            typescript: 5.8.3
            vite: 8.2.2
          - name: TypeScript 5.9 / current Vite 8 peers
            typescript: 5.9.3
            vite: 8.2.2
          - name: TypeScript 6.0 / current Vite 8 peers
            typescript: 6.0.3
            vite: 8.2.2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run test:smoke:nest
        env:
          VITE_LINK_SMOKE_TYPESCRIPT: ${{ matrix.typescript }}
          VITE_LINK_SMOKE_VITE: ${{ matrix.vite }}

  production-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run audit:prod

  performance:
    name: Development-tool benchmark
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run perf:product -- performance-ci.json
      - uses: actions/upload-artifact@v7
        with:
          name: performance-${{ github.sha }}
          path: performance-ci.json
          if-no-files-found: error
          retention-days: 30
