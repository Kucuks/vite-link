name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string
      confirm:
        description: I confirm this public npm publication
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: inputs.confirm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Verify npm supports trusted publishing
        run: >-
          node -e "const { execFileSync }=require('node:child_process');
          const version=execFileSync('npm',['--version'],{encoding:'utf8'}).trim();
          const [major,minor]=version.split('.').map(Number);
          if(major<11||(major===11&&minor<5)) throw new Error('npm >= 11.5.1 is required for trusted publishing; found '+version);
          console.log('npm '+version+' supports trusted publishing')"
      - name: Verify version and release tag
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_TAG: v${{ inputs.version }}
        run: >-
          node -e "const p=require('./package.json');
          if(p.version!==process.env.EXPECTED_VERSION) throw new Error('package.json version does not match the requested version');
          const {execFileSync}=require('node:child_process');
          const tags=execFileSync('git',['tag','--points-at','HEAD'],{encoding:'utf8'}).trim().split(/\s+/);
          if(!tags.includes(process.env.RELEASE_TAG)) throw new Error('Checked-out commit is not tagged '+process.env.RELEASE_TAG)"
      - name: Publish with npm trusted publishing
        run: npm publish --access public --provenance
